services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: grid_forge
      POSTGRES_PASSWORD: grid_forge
      POSTGRES_DB: grid_forge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grid_forge"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      GRID_FORGE_ENV: demo
      GRID_FORGE_BIND_ADDR: 0.0.0.0:8080
      GRID_FORGE_DATABASE_URL: postgres://grid_forge:grid_forge@postgres:5432/grid_forge
      GRID_FORGE_JWT_SECRET: local-compose-secret-change-me
      GRID_FORGE_DEMO_MODE: "true"
      GRID_FORGE_OBJECT_STORE_ENDPOINT: http://minio:9000
      RUST_LOG: info,grid_forge_api=debug
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      GRID_FORGE_ENV: demo
      GRID_FORGE_DATABASE_URL: postgres://grid_forge:grid_forge@postgres:5432/grid_forge
      GRID_FORGE_JWT_SECRET: local-compose-secret-change-me
      GRID_FORGE_DEMO_MODE: "true"
      GRID_FORGE_OBJECT_STORE_ENDPOINT: http://minio:9000
      RUST_LOG: info,grid_forge_worker=debug

volumes:
  postgres-data:
  minio-data:
